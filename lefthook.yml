# https://lefthook.dev/configuration/
glob_matcher: doublestar

pre-commit:
  parallel: true
  jobs:
    - name: lint
      files: git diff --name-only --cached --diff-filter=ACMR
      glob: "**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,astro}"
      run: pnpm exec oxlint {files}

    - name: format
      files: git diff --name-only --cached --diff-filter=ACMR
      glob:
        - "src/**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css,md,mdx}"
        - "scripts/**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css,md,mdx}"
        - "lib/**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css,md,mdx}"
      run: pnpm exec oxfmt --check {files}

    - name: test
      files: git diff --name-only --cached --diff-filter=ACMR
      glob: "src/**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
      run: pnpm exec vitest related --run --passWithNoTests {files}
