name: Quality gate
description: Require Sanity settings, then lint, format, typecheck, and test.

runs:
  using: composite
  steps:
    - name: Require Sanity environment
      shell: bash
      run: |
        project_id="${SANITY_PROJECT_ID_VAR:-${SANITY_PROJECT_ID_SECRET:-${SANITY_STUDIO_PROJECT_ID_VAR:-$SANITY_STUDIO_PROJECT_ID_SECRET}}}"
        dataset="${SANITY_DATASET_VAR:-${SANITY_DATASET_SECRET:-${SANITY_STUDIO_DATASET_VAR:-$SANITY_STUDIO_DATASET_SECRET}}}"
        if [ -z "$project_id" ] || [ -z "$dataset" ]; then
          echo "The selected GitHub environment must provide a Sanity project id and dataset." >&2
          echo "Project id: SANITY_PROJECT_ID or SANITY_STUDIO_PROJECT_ID." >&2
          echo "Dataset: SANITY_DATASET or SANITY_STUDIO_DATASET." >&2
          exit 1
        fi
        {
          printf 'SANITY_PROJECT_ID=%s\n' "$project_id"
          printf 'SANITY_DATASET=%s\n' "$dataset"
          printf 'SANITY_STUDIO_PROJECT_ID=%s\n' "$project_id"
          printf 'SANITY_STUDIO_DATASET=%s\n' "$dataset"
        } >> "$GITHUB_ENV"

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Lint
      shell: bash
      run: pnpm lint

    - name: Check formatting
      shell: bash
      run: pnpm fmt:check

    - name: Typecheck
      shell: bash
      run: pnpm typecheck

    - name: Test
      shell: bash
      run: pnpm test
